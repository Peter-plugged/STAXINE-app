<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAXINE | Financial Mesh Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00f0ff">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-area">
            <div class="logo-icon">S</div>
            <h1>STAXINE MESH</h1>
        </div>
        <div class="status-badge">
            <div class="pulse-dot"></div>
            <span id="system-status">MESH ONLINE</span>
        </div>
    </header>

    <main>
        <!-- Prompt / Command Center Panel -->
        <section class="panel">
            <div class="panel-title">
                <span>COMMAND CENTER</span>
                <span style="font-size: 0.75rem; color: var(--text-muted);">AI ORCHESTRATOR v2.4</span>
            </div>
            
            <div class="prompt-container">
                <div class="input-group">
                    <textarea id="prompt-input" placeholder="Enter financial prompt or execute trading directive..."></textarea>
                </div>
                
                <div class="action-buttons">
                    <button id="mic-btn" class="btn-mic" title="Record Voice Command">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                        <span id="mic-text">Voice</span>
                    </button>
                    <button id="submit-btn" class="btn-primary">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        Submit Directive
                    </button>
                </div>
            </div>

            <div class="panel-title" style="margin-top: 0.5rem;">
                <span>AI RESPONSE / PREDICTION</span>
            </div>
            <div id="response-box" class="response-box">Awaiting prompt execution...</div>
        </section>

        <!-- Live Agent Logs Panel -->
        <section class="panel">
            <div class="panel-title">
                <span>LIVE AGENT LOGS</span>
                <span id="log-count" style="font-size: 0.75rem; color: var(--text-muted);">SYNCING...</span>
            </div>

            <div id="logs-container" class="logs-container">
                <div class="log-item">
                    <div class="log-header">
                        <span>SYSTEM</span>
                        <span>--:--:--</span>
                    </div>
                    <div class="log-message">Initializing STAXINE Agent Mesh telemetry stream...</div>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js?v=99"></script>
</body>
</html>
